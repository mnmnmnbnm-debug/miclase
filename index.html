<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mi Clase · ¡Sí se puede coreano!</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d1d1d"><script src="https://accounts.google.com/gsi/client" async defer></script><script src="config.js"></script></head><body><title>Mi Clase · Sí se puede coreano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: phone-first app shell centered on a hanji page; role switch above, tab bar below. */
:root{
  --bg:#f5f1ea; --surface:#ffffff; --surface2:#ebe4d8; --line:#e3dbcf;
  --ink:#1b1b1b; --ink2:#5c554d; --accent:#e5452f; --accent-t:#c0341f;
  --ok:#27704f; --warn:#85590c; --b1:#2a5db0; --b2:#6b3fa0;
  --stage:#1b1b1b; --on-stage:#f5f1ea; --stage2:#2b2926;
  --f-text:"Inter",system-ui,sans-serif; --f-ko:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1f1d1b; --surface2:#2a2724; --line:#38342f;
  --ink:#f5f1ea; --ink2:#bdb3a7; --accent:#ff6a52; --accent-t:#ff7d68;
  --ok:#5cc394; --warn:#e0b25a; --b1:#86a8ff; --b2:#c39bf0; --stage:#0c0b0a; --on-stage:#f5f1ea; --stage2:#24221f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1f1d1b; --surface2:#2a2724; --line:#38342f;
  --ink:#f5f1ea; --ink2:#bdb3a7; --accent:#ff6a52; --accent-t:#ff7d68;
  --ok:#5cc394; --warn:#e0b25a; --b1:#86a8ff; --b2:#c39bf0; --stage:#0c0b0a; --on-stage:#f5f1ea; --stage2:#24221f; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-text);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.ko{font-family:var(--f-ko);word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:12px}
.shell{container:app / inline-size;width:100%;margin:0 auto;transition:max-width .25s}
.shell[data-w="phone"]{max-width:420px}.shell[data-w="tablet"]{max-width:820px}.shell[data-w="pc"]{max-width:1280px}
.devbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.devbar .seg button{padding:5px 11px;font-size:12px}
.devnow{font-weight:700;color:var(--ink)}
.intro{display:grid;gap:8px}
.intro h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.intro h1 span{color:var(--accent-t)}
.intro p{margin:0;color:var(--ink2);font-size:13px}
.roles{display:grid;grid-template-columns:repeat(4,1fr);max-width:680px;gap:4px;background:var(--surface2);padding:4px;border-radius:999px}
.roles button{border:0;background:transparent;padding:8px 6px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.roles button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.app{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:640px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;flex:none;display:block;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.wm{display:grid;line-height:1.1}
.wm b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.wm span{font-size:11.5px;font-weight:700;color:var(--accent-t);letter-spacing:.01em;margin-top:2px}
@container app (min-width: 700px){.mark{width:52px;height:52px;border-radius:14px}.wm b{font-size:22px}}
.who{font-size:12px;color:var(--ink2);text-align:right;line-height:1.3}
.screen{flex:1;padding:16px 18px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}
.screen form.row input{min-width:0;flex:1}
.tabs{display:grid;grid-template-columns:repeat(var(--n,5),1fr);border-top:1px solid var(--line);background:var(--surface)}
.tabs button{border:0;background:transparent;padding:10px 2px 12px;font-size:11.5px;font-weight:600;color:var(--ink2);display:grid;justify-items:center;gap:3px}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--accent)}
h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
h3{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0;align-content:start}
.card.soft{background:var(--surface2);border-color:transparent}
.card.dark{background:var(--stage);color:var(--on-stage);border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:8px}
.muted{color:var(--ink2);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-a1{background:var(--ok);color:#fff}
.p-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-red{background:color-mix(in srgb,var(--accent-t) 14%,transparent);color:var(--accent-t)}
.p-gray{background:var(--surface2);color:var(--ink2)}
.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:700;font-size:14px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--accent-t);color:#fff}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;color:var(--accent-t);text-decoration:underline;font-weight:600;font-size:13px}
.big{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.list{display:grid;gap:0}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li > div{min-width:0}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;color:#fff}
.box.on{background:var(--ok);border-color:var(--ok)}
.notice{border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-size:13.5px}
textarea,input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
label{font-size:12.5px;font-weight:600;color:var(--ink2);display:grid;gap:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* flashcard */
.flash{border-radius:20px;background:var(--surface2);min-height:180px;display:grid;place-items:center;text-align:center;padding:18px;border:0;width:100%}
.flash .w{font-family:var(--f-ko);font-size:40px;font-weight:900;line-height:1.1}
.flash .r{color:var(--ink2);font-size:13px;margin-top:4px}
.flash .m{font-size:20px;font-weight:700;margin-top:8px}
/* quiz */
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--accent-t);color:var(--accent-t);text-decoration:underline}
.q{display:grid;gap:6px}
.q .qk{font-family:var(--f-ko);font-weight:900;font-size:22px}
/* expressions */
.expr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.expr:first-child{border-top:0}
.expr .k{font-family:var(--f-ko);font-weight:700;font-size:17px}
.expr .e{font-size:13.5px}
.expr .rr{font-size:12px;color:var(--ink2)}
.say{grid-row:1 / span 3;grid-column:2;align-self:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center}
.say svg{width:18px;height:18px}
/* live class */
.stage{background:var(--stage);color:var(--on-stage);border-radius:18px;padding:12px;display:grid;gap:10px}
.main-tile{aspect-ratio:16/10;max-width:100%;border-radius:12px;background:var(--stage2);display:grid;place-items:center;position:relative;overflow:hidden}
.main-tile .av{width:72px;height:72px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-family:var(--f-ko);font-weight:900;font-size:28px;color:#fff}
.main-tile .tag{position:absolute;left:10px;bottom:8px;font-size:12px;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:999px;color:#fff}
.main-tile .live{position:absolute;right:10px;top:8px;font-size:11px;font-weight:800;background:var(--accent-t);color:#fff;padding:2px 8px;border-radius:999px;letter-spacing:.05em}
.board{position:absolute;left:12px;top:12px;font-family:var(--f-ko);font-size:15px;line-height:1.5;color:var(--on-stage);opacity:.9}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini div{aspect-ratio:4/3;border-radius:8px;background:var(--stage2);display:grid;place-items:center;font-size:11px;color:#cfc6bb;text-align:center;padding:2px}
.mini .me{outline:2px solid var(--accent)}
.ctrls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctrl{border:0;background:var(--stage2);color:var(--on-stage);border-radius:999px;padding:9px 13px;font-size:12.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.ctrl[aria-pressed="true"]{background:var(--on-stage);color:var(--stage)}
.ctrl:disabled{opacity:.35;cursor:not-allowed}
.ctrl.leave{background:var(--accent-t);color:#fff}
.chat{display:grid;gap:6px;font-size:13px;max-height:150px;overflow:auto}
.chat b{font-weight:700}
.att{display:flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--on-stage);border-radius:10px;padding:8px 10px;font-size:13px}
.att.late{background:color-mix(in srgb,var(--warn) 30%,transparent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px);z-index:20}
.lock{display:flex;gap:10px;align-items:flex-start}
.lock svg{width:20px;height:20px;flex:none;color:var(--ink2);margin-top:2px}
.meter{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.note{font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px}
.example{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.plan{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:4px;text-align:left;background:var(--surface);width:100%}
.plan[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.plan[data-p="vivo"]{--pc:var(--accent-t)}.plan[data-p="oyente"]{--pc:var(--b1)}.plan[data-p="privada"]{--pc:var(--b2)}
.plan:disabled{opacity:.45;cursor:not-allowed}
.plan[data-p]{position:relative;border-width:2px;padding:14px}
.plan[data-p] b{padding-right:118px}
.plan[data-p][aria-pressed="false"]{opacity:.7}
.plan[data-p][aria-pressed="true"]{background:color-mix(in srgb,var(--pc) 13%,var(--surface));border-color:var(--pc);box-shadow:none;opacity:1}
.plan[data-p][aria-pressed="true"] b{color:var(--pc)}
.plan[data-p][aria-pressed="true"] li::marker{color:var(--pc)}
.plan[data-p][aria-pressed="true"]::after{content:"✓ Seleccionado";position:absolute;top:12px;right:12px;background:var(--pc);color:var(--surface);font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.planpill{color:var(--surface)}.planpill.vivo{background:var(--accent-t)}.planpill.oyente{background:var(--b1)}.planpill.privada{background:var(--b2)}
.plan b{font-size:15px}
.plan ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
/* ---- Tablet (container ≥ 700px): side rail + 2 columns ---- */
@container app (min-width: 700px){
  .app{display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"bar bar" "nav main";min-height:720px}
  .bar{grid-area:bar;padding:16px 24px}
  .screen{grid-area:main;grid-template-columns:repeat(2,minmax(0,1fr));padding:24px;gap:16px}
  .screen > *{grid-column:1 / -1}
  .screen > .card{grid-column:auto}
  .screen > .card.wide,.screen > .card.span2{grid-column:1 / -1}
  .tabs{grid-area:nav;grid-template-columns:1fr;align-content:start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:12px 8px}
  .tabs button{border-radius:14px;padding:10px 4px}
  .tabs button[aria-current="page"]{background:var(--surface2)}
  .grid2{grid-template-columns:repeat(4,minmax(0,1fr))}
  h2{font-size:22px}
  .big{font-size:26px}
}
/* ---- Computer (container ≥ 1080px): labeled sidebar + 3 columns ---- */
@container app (min-width: 1080px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .tabs{padding:16px 12px}
  .tabs button{display:flex;align-items:center;gap:12px;padding:11px 14px;font-size:14px;justify-content:flex-start}
  .screen{grid-template-columns:repeat(3,minmax(0,1fr));padding:28px 32px}
  .screen > .card.span2,.screen > .stage{grid-column:span 2}
  .flash{min-height:240px}
  .chat{max-height:420px}
  .flash .w{font-size:56px}
  .q .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
}
.demo-grp{align-items:center}.demo-grp button{padding:5px 11px;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.lg{width:16px;height:16px;border-radius:5px;display:inline-grid;place-items:center;font-style:normal;font-size:10px;font-weight:800}
.lg.ok,.chip.ok,.day.ok{--c:var(--ok)}.lg.retardo,.chip.retardo,.day.retardo{--c:var(--warn)}.lg.falta,.chip.falta,.day.falta{--c:var(--accent-t)}
.lg.ok,.lg.retardo,.lg.falta{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.lg.cur{background:var(--ink)}.lg.next{border:1.5px dashed var(--line)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.chip{flex:none;width:62px;scroll-snap-align:start;border-radius:12px;padding:6px 4px;display:grid;justify-items:center;gap:0;font-size:11px;color:var(--ink2);border:1.5px dashed var(--line)}
.chip b{font-size:18px;color:var(--ink);line-height:1.2}
.chip .cn{font-size:10px;font-weight:700}
.chip.ok,.chip.retardo,.chip.falta{border:0;background:color-mix(in srgb,var(--c) 14%,transparent)}
.chip.ok .cs,.chip.retardo .cs,.chip.falta .cs{color:var(--c);font-weight:800}
.chip.cur{border:0;background:var(--ink);color:var(--bg)}.chip.cur b{color:var(--bg)}.chip.cur .cs{font-weight:700;color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.dow{font-size:11px;font-weight:700;color:var(--ink2);padding:2px 0}
.day{border-radius:10px;min-height:42px;display:grid;align-content:center;justify-items:center;font-size:13px;color:var(--ink2);gap:0}
.day b{font-weight:600}
.day span{font-size:10px;font-weight:800;line-height:1}
.day.cls{color:var(--ink)}
.day.ok,.day.retardo,.day.falta{background:color-mix(in srgb,var(--c) 15%,transparent)}
.day.ok span,.day.retardo span,.day.falta span{color:var(--c)}
.day.cur{background:var(--ink);color:var(--bg)}.day.cur span{color:var(--accent)}
.day.next{border:1.5px dashed var(--line)}.day.next span{color:var(--ink2);font-weight:600}
.day.off{color:var(--ink2);text-decoration:line-through}.day.off span{text-decoration:none;font-weight:600}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.pick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pick button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;display:grid;text-align:left;gap:1px;min-width:118px}
.pick button span{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.pick button b{font-size:14.5px}
.pick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick button[aria-pressed="true"] span{color:var(--accent)}
.gtag{display:inline-block;background:var(--surface2);border-radius:8px;padding:1px 7px;margin:2px 2px 0 0;color:var(--ink);font-size:12.5px;font-weight:700}
.qalist{display:grid;gap:10px}
.qa{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.qhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.qn{width:26px;height:26px;border-radius:50%;background:var(--accent-t);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:800}
.qk2{font-size:19px;font-weight:900}
.ans{display:grid;gap:6px;background:var(--surface2);border-radius:12px;padding:8px 12px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0}
.ak{font-size:16.5px;font-weight:700;color:var(--ok)}
.qa .say,.arow .say{grid-row:auto;grid-column:auto}
.sbtn{border:0;text-align:left;cursor:pointer}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input{grid-column:1 / -1}
.stable{display:grid}
.shead,.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center}
.shead{display:none;font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;padding:6px 0;border-bottom:1px solid var(--line)}
.shead span:nth-child(3),.shead span:nth-child(4),.shead span:nth-child(5){text-align:right}
.srow{border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:10px 0;width:100%;font-size:13.5px}
.srow:first-of-type{border-top:0}
.srow:hover{background:var(--surface2)}
.srow i,.stat i{font-style:normal}
.sname{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;min-width:0}
.sname small{flex-basis:100%;color:var(--ink2);font-size:11.5px}
.sgrp{grid-column:1;grid-row:2;font-size:12px;color:var(--ink2)}
.sgrp br{display:none}.sgrp i{margin-left:4px}
.snum{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}

  const g=t=>(o.find(x=>x.type===t)||{}).value||"";const wd=g("weekday");let ap=g("dayPeriod").toLowerCase().replace(/\s/g,"").replace(/ /g,"");ap=ap.startsWith("p")?"p.m.":"a.m.";
  return {wd:wd.charAt(0).toUpperCase()+wd.slice(1),day:g("day"),mon:g("month").replace(".",""),time:`${g("hour")}:${g("minute")} ${ap}`}}

function lSlot(dows,hm,ref="2027-01-25"){const base=new Date(ref+"T12:00:00Z");const P=dows.map(i=>{const d=new Date(base.getTime()+i*864e5).toISOString().slice(0,10);return lParts(cdmxInstant(d,hm))});
  const ds=P.map(x=>WD3[x.wd]||x.wd);return {days:ds.length>1?ds.slice(0,-1).join(", ")+" y "+ds[ds.length-1]:ds[0],time:P[0].time}}
function lWhen(iso,t,e){const a=lParts(cdmxInstant(iso,t)),b=lParts(cdmxInstant(iso,e));return `${a.wd} ${a.day} ${a.mon} · ${a.time} – ${b.time}`}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuiz(words,n){
  const pool=words.filter(w=>w[0]&&w[2]);
  return shuffle(pool).slice(0,Math.min(n,pool.length)).map(w=>{
    const others=shuffle(pool.filter(x=>x!==w)).slice(0,3).map(x=>x[2]);
    return {k:w[0],ans:w[2],opts:shuffle([w[2],...others])};
  });

    <div class="li"><div><b>¿Necesito saber algo de coreano?</b><div class="muted">No. Los grupos A1 empiezan desde el hangul. Si ya estudiaste, <button class="link" data-act="gNivel">haz la prueba de nivel</button>.</div></div></div>
    <div class="li"><div><b>¿Qué pasa si falto?</b><div class="muted">Tienes la grabación y las notas de cada clase.</div></div></div>
    <div class="li"><div><b>¿Puedo cambiar de plan?</b><div class="muted">Sí, al empezar el siguiente Ciclo.</div></div></div>
    <div class="li"><div><b>¿Cómo pago?</b><div class="muted">Solo con PayPal. Dentro de PayPal puedes pagar con tarjeta de crédito o débito.</div></div></div>
    <div class="li"><div><b>¿Emiten factura?</b><div class="muted">No emitimos facturas fiscales de ningún país (por ejemplo, CFDI en México), porque el servicio se ofrece desde Corea. Si necesitas un comprobante coreano (현금영수증), con gusto te lo damos: solo pídelo.</div></div></div>

    case "grpOpen":S.stuGrp=b.dataset.g;S.stuF={g:"all",plan:"all",st:"all"};S.stuQ="";break;
    case "grpBack":S.stuGrp=null;S.stuSel=null;break;
    case "cycleAtt":{const n=b.dataset.n;if(n.startsWith("Ana")){toast("Ana는 입장하면 자동으로 기록돼요");return}const order=["Presente","Retardo","Falta"];S.rollOverride[n]=order[(order.indexOf(rollStatus(n))+1)%3];break}
    case "fb":{const f=b.dataset.f;if(b.dataset.i==="me"){S.hw.feedback=f;S.hw.status="revisada"}else S.hwReview[+b.dataset.i].fb=f;toast("피드백 저장 · 학생 화면에 표시돼요");break}
    case "gen":{const v=($("#genIn")||{}).value||S.genWords;S.genWords=v;const words=v.split("\n").map(l=>l.split("=").map(s=>s.trim())).filter(p=>p.length===2&&p[0]&&p[1]).map(p=>[p[0],"",p[1]]);if(words.length<4){toast("단어를 4개 이상 넣어 주세요");return}S.genQuiz=makeQuiz(words,Math.min(10,words.length));break}
    case "publishQuiz":S.quiz=S.genQuiz.map(q=>({...q}));S.pcls=7;S.quizFor=7;S.quizAns={};S.quizDone=false;S.quizPublished=true;toast("공개 완료 · 학생 Práctica → Quiz semanal에 보여요");break;
  }
  render();
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target.dataset.form;
  if(f==="chat"){const v=$("#chatIn").value.trim();if(!v)return;S.chat.push(["Tú",v]);render();const c=document.querySelector(".chat");if(c)c.scrollTop=c.scrollHeight}
  if(f==="aviso"){const v=$("#avIn").value.trim();if(!v){toast("공지 내용을 써 주세요");return}const to=S.avT||avNext();S.avisos.unshift({t:v,d:"Ahora",to});S.avT=null;toast(`${avLabel(to)}에 올렸어요 · ${avHint(to).replace("보여요","보여요")}`);render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#lvmodal").hidden)lvModal(null)});
document.addEventListener("input",e=>{const t=e.target;if(t.classList&&(t.classList.contains("hwta")||t.classList.contains("hwfb"))){const R=hwRec(t.dataset.hk);(t.classList.contains("hwta")?R.a:R.fb)[t.dataset.q]=t.value;if(t.classList.contains("hwta"))queueAns(t.dataset.hk,t.dataset.q,t.value);const f=t.closest(".card")&&t.closest(".card").querySelector(".hwfoot .muted");if(f&&t.classList.contains("hwta")){const c=t.closest(".card"),all=c.querySelectorAll(".hwta"),n=[...all].filter(z=>z.value.trim()).length;f.textContent=n+" de "+all.length+" respondidas · se guarda solo"}return}if(t.classList&&t.classList.contains("pltxt")){PL.w[t.dataset.wi]=t.value;plSave()}});
document.addEventListener("change",e=>{if(e.target.id==="gsSel"){S.gs=e.target.value;S.role="guest";S.tab="hoy";S.enroll.step=0;render();return}if(e.target.id==="tzSel"){S.tz=e.target.value||null;applyWho();render();return}if(e.target.id==="whoSel"){const [g,...n]=e.target.value.split("|");S.who={g,n:n.join("|")};S.tab="hoy";S.inClass=false;applyWho();render();return}if(e.target.id==="avTo"){S.avT=e.target.value;$("#avBtn").textContent=avLabel(S.avT)+"에 올리기";$("#avHint").textContent=avHint(S.avT);return}if(e.target.id==="pDur"){S.priv.dur=+e.target.value;render();return}if(e.target.id==="pCap"){S.priv.cap=+e.target.value;render();return}const m={fP:"plan",fS:"st"}[e.target.id];if(m){S.stuF[m]=e.target.value;render()}});
document.addEventListener("input",e=>{if(e.target.id==="stuQ"){S.stuQ=e.target.value;const pos=e.target.selectionStart;render();const i=$("#stuQ");if(i){i.focus();i.setSelectionRange(pos,pos)}return}if(e.target.id==="stuNote"){S.stuNotes[e.target.dataset.id]=e.target.value;return}if(e.target.id==="hwIn")S.hw.text=e.target.value;if(e.target.id==="genIn")S.genWords=e.target.value});
SCHED.wk.dates=grpDates(GRP[0]);SCHED.we.dates=grpDates(GRP[2]);
SCHED.wk.cur=SCHED.wk.dates.findIndex(d=>d>=TODAY);
SCHED.we.cur=SCHED.we.dates.findIndex(d=>d>=TODAY);
/* ===== Arranque de la app real: sesión con Google + datos desde la API ===== */
const CONF=window.MC_CONFIG||{},API=CONF.API_URL,CID=CONF.CLIENT_ID;
const ID_IN={intensivo10:"int10"},ID_OUT={int10:"intensivo10"};
let TOK=null,ME=null,HWLIST=[];
try{const t=JSON.parse(localStorage.getItem("mc_tok")||"null");if(t&&t.exp>Date.now()+60000)TOK=t.v}catch(e){}
HWA={};hwaSave=()=>{};
function api(a,p){
  return fetch(API,{method:"POST",body:JSON.stringify(Object.assign({a,t:TOK},p||{}))}).then(r=>r.json()).then(j=>{
    if(j.me)ME=j.me;if(!j.ok)throw new Error(j.error||"error");return j.data});
}
const AQ={};let AQT=null;
function queueAns(hk,q,v){const iso=hk.split("|").pop();AQ[iso+"|"+q]={iso,q,v};clearTimeout(AQT);AQT=setTimeout(flushAns,1200)}
function flushAns(){const L=Object.values(AQ);Object.keys(AQ).forEach(k=>delete AQ[k]);return Promise.all(L.map(x=>api("saveAnswer",x).catch(()=>{AQ[x.iso+"|"+x.q]=x})))}
function loadGroup(g){
  const id=ID_IN[g.id]||g.id;
  const dur=/^(sab|dom)/.test(id)&&id!=="dom9"?"2:00:00":"1:00:00";
  const QQ=(window.__QA||{})[g.id]||{};
  REAL[id]=(g.classes||[]).map(c=>Object.assign({},c,{dur:c.dur||dur},QQ[c.iso]?{qa:QQ[c.iso]}:{}));
  ATTD[id]=g.att||{};HWD[id]=g.hw||{};RECS[id]=g.recs||{};
  const gr=GRP.find(x=>x.id===id);if(gr&&g.students)gr.st=g.students.slice();
  STAT[id]={};(g.students||[]).forEach(n=>{let p=0,t=0;Object.values(g.att||{}).forEach(a=>{if(a[n]){t++;if(a[n]==="P")p++}});STAT[id][n]=[p,t]});
}

/* Profesor: alumnos reales, 1:1 desde Calendar y progreso desde la hoja Progreso */
function applyTeacher(d){
  Object.entries(d.progreso||{}).forEach(([k,v])=>{PROG[ID_IN[k]||k]=v});
  const PV=d.privados||[];
  PRIVL=PV.filter(p=>p.tipo!=="preply").map(p=>({n:p.n,days:[],t:p.t,e:p.e,from:p.from,until:p.until,note:p.note}));
  const C=d.cal1||[];
  PREPLY=C.filter(x=>x.src==="preply").map(x=>[x.date,x.t,x.e,x.who]);
  Object.keys(EXTRA).forEach(k=>delete EXTRA[k]);Object.keys(SKIP).forEach(k=>delete SKIP[k]);
  C.filter(x=>x.src!=="preply").forEach(x=>(EXTRA[x.date]=EXTRA[x.date]||[]).push({t:x.t,e:x.e,g:"1:1 "+x.who,n:1,k:"priv"}));
  const R=d.alumnos||[],mk=(n,gid,g,o)=>Object.assign({id:++_sid,n,gid,g,lv:"",plan:"vivo",pay:"unk",until:"결제 정보 연동 전",att:null,quiz:null,hw:null,last:"—",since:"2026-4",mail:"—",tel:"—",att7:null},o||{});
  STUDENTS.length=0;_sid=0;
  GRP.forEach(g=>{const sid=ID_OUT[g.id]||g.id,p=PROG[g.id]||{},seen={};
    R.filter(r=>r.gid===sid&&r.estado!=="inactivo").forEach(r=>{const n=r.name||r.email.split("@")[0];seen[n]=1;
      const a=(STAT[g.id]||{})[r.name];STUDENTS.push(mk(n,g.id,g.name,{plan:r.plan==="oyente"?"oyente":"vivo",mail:r.email,lv:p.book?`${p.book} ${p.lesson||""}`.trim():"",att:a&&a[1]?a[0]/a[1]*100:null,last:r.name?"":"이름 확인 필요"}))});
    (g.st||[]).forEach(n=>{if(!seen[n]){const a=(STAT[g.id]||{})[n];STUDENTS.push(mk(n,g.id,g.name,{lv:"",att:a&&a[1]?a[0]/a[1]*100:null,mail:"(이메일 없음)"}))}});
    if(GMETA[g.name]&&p.book)GMETA[g.name].topic=`${p.book} ${p.lesson||""}${p.page?" "+p.page:""} · 최근 ${p.recentDate||""}`;
  });
  /* Inscripciones pendientes (hoja Inscripciones) */
  S.pending=(d.inscripciones||[]).map(x=>({who:x.name||x.email,group:x.group,plan:x.plan,pay:x.pay,row:x.row,email:x.email,at:x.at}));
  /* Recomendación de reinscripción con el progreso real (hoja Progreso) y alumnos reales */
  const LVV={1:"A1",2:"A2",3:"B1",4:"B2"};  // 대표님 2026-11-20: 세종 4 = B2 또는 회화
  Object.keys(GCNT).forEach(k=>delete GCNT[k]);
  GRP.forEach(g=>{const sid=ID_OUT[g.id]||g.id;GCNT[g.id]=R.filter(r=>r.gid===sid&&r.estado!=="inactivo").length||null;
    const p=PROG[g.id],Rr=REREG[g.id];if(!p||!Rr)return;
    const src=[p.book,p.lesson,p.page].filter(Boolean).join(" "),first=String(p.topic||"").split(" · ")[0],when=p.recentDate?`최근 ${p.recentDate}: ${first}`:"";
    const vol=/세종\s*(\d)/.exec(p.book||"");
    if(/세종/.test(p.book||"")){Rr.src=src;if(vol){Rr.lv=LVV[vol[1]]||"Conversación";Rr.lv2=Rr.lv==="B2"?"Conversación":(+vol[1]>=5?"":"");Rr.est=false;Rr.why=when}else{Rr.est=true;Rr.why=`책 권수 미기재 · ${when}`}}
    else{Rr.src=src;Rr.lv="Conversación";Rr.est=false;if(!Rr.warn)Rr.why=when}
  });
  const priv=PV.map(p=>mk(p.n,"priv","1:1 과외",{lv:p.tipo==="preply"?"Preply":"Clase privada",plan:"vivo",mail:p.email||"—",last:p.note||"—"}));
  if(priv.length){priv.forEach(x=>STUDENTS.push(x));GMETA["1:1 과외"]={lv:"1:1",when:"개인별 시간 (Calendar 기준)",cur:0,tot:1,topic:`${C.filter(x=>x.date>=TODAY).length}회 예정`}}
}
function setToken(cred){
  try{const p=JSON.parse(atob(cred.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));localStorage.setItem("mc_tok",JSON.stringify({v:cred,exp:p.exp*1000}))}catch(e){}
  TOK=cred;try{localStorage.setItem("mc_was","1")}catch(e){}start();
}
function loginBox(msg){
  $("#screen").innerHTML=`<div class="realbar"><div class="big">¡Hola! 👋</div><div>${msg||"Entra con tu cuenta de Google para ver tus clases."}</div><div id="gbtn"></div><button class="btn sm alt" data-act="asGuest">Seguir sin cuenta</button></div>`;
  const draw=()=>{if(!(window.google&&google.accounts&&google.accounts.id))return setTimeout(draw,300);
    google.accounts.id.initialize({client_id:CID,callback:r=>setToken(r.credential),auto_select:true});
    google.accounts.id.renderButton($("#gbtn"),{theme:"outline",size:"large",text:"continue_with",locale:"es"});try{google.accounts.id.prompt()}catch(e){}};
  draw();
}
function logout(){try{localStorage.removeItem("mc_tok");localStorage.removeItem("mc_was")}catch(e){}TOK=null;ME=null;try{google.accounts.id.disableAutoSelect()}catch(e){}location.reload()}
function start(){
  if(!API||!CID){$("#screen").innerHTML=`<div class="realbar"><b>Falta configurar la app</b><div class="muted">Pon API_URL y CLIENT_ID en config.js</div></div>`;return}
  if(!TOK){let was=false;try{was=localStorage.getItem("mc_was")==="1"}catch(e){}
    if(was){loginBox("Volviendo a entrar con tu cuenta de Google…");return}
    S.role="guest";S.gs="anon";S.tab=S.tab||"hoy";render();return}
  $("#screen").innerHTML=`<div class="realbar"><div class="muted">Cargando tus clases…</div></div>`;
  api("data").then(d=>{
    const m=ME||{};
    if(m.role==="teacher"){window.__QA=d.preguntas||{};Object.values(d.all||{}).forEach(loadGroup);try{applyTeacher(d)}catch(e){console.error(e)}S.role="prof";S.profTab="panel";
      const first=GRP.find(g=>g.st&&g.st.length)||GRP[0];S.who={g:first.id,n:first.st[0]||""};applyWho();
      api("hwList").then(L=>{HWLIST=L||[];render()});render();return}
    if(m.role==="student"&&d.group){window.__QA={[d.group.id]:d.preguntas||{}};window.__CERTS=d.certs||[];loadGroup(d.group);const gid=ID_IN[m.gid]||m.gid;if(d.progreso)PROG[gid]=d.progreso;
      S.who={g:gid,n:m.sname||m.name};S.admin=false;S.role=m.plan==="oyente"?"oyente":"vivo";S.account.plan=S.role;S.tab="hoy";applyWho();
      Object.entries(d.hw||{}).forEach(([iso,v])=>{HWA[hwKey(gid,m.name,iso)]=v});
      (d.avisos||[]).forEach(a=>S.avisos&&S.avisos.unshift&&S.avisos.unshift({t:a.text,at:a.at}));
      render();return}
    S.role="guest";S.gs=m.role==="former"?"ex":"new";S.tab="hoy";render();
  }).catch(e=>{if(/login|token/i.test(e.message))loginBox("Tu sesión terminó. Entra otra vez.");else $("#screen").innerHTML=`<div class="realbar"><b>No pudimos cargar tus clases</b><div class="muted">${esc(e.message)}</div><button class="btn sm" onclick="location.reload()">Reintentar</button></div>`});
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="gLogin"){e.stopImmediatePropagation();loginBox();}
  if(b.dataset.act==="asGuest"){e.stopImmediatePropagation();S.role="guest";S.gs="anon";render();}
  if(b.dataset.act==="logout"){e.stopImmediatePropagation();logout();}
  if(b.dataset.act==="pay"&&S.role!=="prof"){
    if(!TOK){e.stopImmediatePropagation();loginBox("Entra con Google para inscribirte.");return}
    const en=S.enroll,g=NEXT.find(x=>x.id===en.group)||NEXT[1];
    const grp=en.plan==="privada"?`1:1 · ${en.slots.map(slotTxt).join(", ")} · ${en.pack}회`:g.name;
    api("enroll",{name:(ME&&(ME.sname||ME.name))||"",plan:PLN[en.plan],group:grp,pay:b.dataset.m}).catch(()=>toast("No se pudo enviar. Inténtalo otra vez."));}
  if(b.dataset.act==="approve"&&S.role==="prof"){e.stopImmediatePropagation();const p=S.pending[+b.dataset.i];if(!p)return;
    b.disabled=true;api("approveEnroll",{row:p.row}).then(()=>{S.pending.splice(+b.dataset.i,1);toast(`${p.who} 승인 완료`);render()}).catch(er=>{b.disabled=false;toast("승인 실패: "+er.message)});}
},true);
SCHED.wk.dates=grpDates(GRP[0]);
start();
